name: Test the new sm-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Rust sm-action
    runs-on: ubuntu-24.04
    steps:
      - name: Test sm-action v3.0.0-beta.4
        id: secrets
        uses: bitwarden/sm-action@v3.0.0-beta.4
        with:
          access_token: ${{ secrets.TEST_SM_ACCESS_TOKEN_EU }}
          cloud_region: EU
          set_env: true
          secrets: |
            1dabf2d1-b80e-4f2f-9fe3-992e48e3874e > SECRETS_ONE
            a7131ad8-5476-4b90-87f0-13d1e3804ac0 > SECRETS_TWO

      - name: Test env vars are set
        run: |
          echo "SECRETS_ONE=$SECRET_ONE"
          echo "SECRETS_TWO=$SECRET_TWO"
          echo

          echo "$SECRETS_ONE" | sed 's/./& /g'
          echo "$SECRETS_TWO" | sed 's/./& /g'
          echo

      - name: Output test secrets to file
        run: |
          printf '%s\n' "$SECRETS_ONE" > test_secrets.env
          printf '%s\n' "$SECRETS_TWO" > test_secrets.env

      - name: Upload report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Test Secrets Artifact
          path: test_secrets.env
