name: Test the new sm-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Rust sm-action
    runs-on: ubuntu-24.04
    steps:
      - name: Test sm-action v3.0.0-beta
        id: secrets
        uses: bitwarden/sm-action@v3.0.0-beta.4
        with:
          access_token: ${{ secrets.TEST_SM_ACCESS_TOKEN }}
          base_url: https://vault.qa.bitwarden.pw
          set_env: true
          secrets: |
            4f9b7be6-02ed-4e03-aa36-b41e000b8878 > SECRET_MULTILINE

      - name: Test env vars are set
        run: |
          echo "SECRET_MULTILINE=$SECRET_ONE"
          echo

          echo "$SECRET_MULTILINE" | sed 's/./& /g'
          echo

      - name: Print secret value line-by-line
        env:
          SECRET_VAL: ${{ env.SECRET_MULTILINE }}
        run: |
          echo the following multi-line secret should be masked:
          echo "$SECRET_VAL" | while IFS= read -r line; do
            echo "LINE: $line"
          done

      - name: Output test secrets to file
        run: |
          printf '%s\n' "$SECRET_MULTILINE" > test_secrets.env

      - name: Upload report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Test Secrets Artifact
          path: test_secrets.env
